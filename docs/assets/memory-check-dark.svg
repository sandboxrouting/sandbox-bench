<text x="22" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19.8" font-weight="400" fill="#9AACA9" text-anchor="start">Inside the sandbox, start</text>
