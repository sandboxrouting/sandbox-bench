<text x="38" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23.1" font-weight="600" fill="#E1EBE7" text-anchor="start">Before the action</text>
<circle cx="386" cy="22" r="14" fill="none" stroke="#E1EBE7" stroke-width="1.5"/>
<text x="386" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.6" font-weight="600" fill="#E1EBE7" text-anchor="middle">2</text>
<text x="410" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23.1" font-weight="600" fill="#E1EBE7" text-anchor="start">The action</text>
<circle cx="806" cy="22" r="14" fill="none" stroke="#E1EBE7" stroke-width="1.5"/>
<text x="806" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17.6" font-weight="600" fill="#E1EBE7" text-anchor="middle">3</text>
<text x="830" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23.1" font-weight="600" fill="#E1EBE7" text-anchor="start">After: all three must hold</text>
<text x="410" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18.7" font-weight="400" fill="#9AA2F7" text-anchor="start">pause → resume, snapshot → restore,</text>
<text x="410" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18.7" font-weight="400" fill="#9AA2F7" text-anchor="start">or fork (checked in the child)</text>
