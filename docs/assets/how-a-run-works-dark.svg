<text x="755" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="500" fill="#E1EBE7" text-anchor="middle">create, exec,</text>
<text x="408" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#9AACA9" text-anchor="start">Probes run shuffled, one operation in flight.</text>
