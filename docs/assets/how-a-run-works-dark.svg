<text x="755.0" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="400" fill="#9AACA9" text-anchor="middle">responses</text>
