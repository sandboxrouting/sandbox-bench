<text x="22" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18.7" font-weight="400" fill="#9AACA9" text-anchor="start">GitHub Actions, from main</text>
<text x="22" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18.7" font-weight="400" fill="#9AACA9" text-anchor="start">started by hand</text>
