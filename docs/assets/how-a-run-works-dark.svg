<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 506" width="1200" height="506" role="img" aria-labelledby="t d">
<title id="t">How a run works</title>
<desc id="d">A maintainer starts the Benchmark run workflow, which runs sbx run: adapters drive each provider's sandboxes through 10 attempts of every offered probe. The raw run record is written to a separate results repo, sbx report scores it, and the leaderboard tables are committed and pushed.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 Z" fill="#E1EBE7"/></marker><marker id="a-alive" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 Z" fill="#43D19E"/></marker><marker id="a-act" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 Z" fill="#9AA2F7"/></marker><marker id="a-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 Z" fill="#F2705F"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 Z" fill="#6E8280"/></marker></defs>
