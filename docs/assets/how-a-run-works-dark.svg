<text x="36" y="200" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.4" font-weight="400" fill="#9AACA9" text-anchor="start">10 attempts per probe</text>
<rect x="400" y="40" width="280" height="196" rx="10" fill="#141F21" stroke="#2D3E3F" stroke-width="1.5"/>
<text x="422" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22.0" font-weight="600" fill="#E1EBE7" text-anchor="start">Adapters</text>
