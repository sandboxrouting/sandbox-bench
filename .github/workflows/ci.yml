name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"          # never resolve in CI: the lockfile is the source of truth
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Lockfile is up to date
        run: uv lock --check
        env:
          UV_FROZEN: "0"         # --check needs to resolve; uv rejects an empty value
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .
      - name: mypy (strict)
        run: uv run mypy
      - name: Harness line budget
        run: uv run python scripts/check_budget.py
      - name: shellcheck
        run: shellcheck deploy/*.sh

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: pytest (offline, fake provider)
        run: uv run pytest -m "not live" --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  package:
    name: Build & smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - name: Install the wheel in a clean tool env and run it
        run: |
          uv tool install dist/*.whl
          sbx --version
          sbx providers
          sbx providers | grep -q '^fake'

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx zizmor@1.32.0 --format=github .github/workflows

  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, test, package, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = "false"
