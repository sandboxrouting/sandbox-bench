[project]
name = "sandbox-bench"
version = "0.1.0.dev0"
description = "Does your sandbox really keep your agent's running process when you pause, snapshot or fork it, and how fast?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "sandbox-bench maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
# Provider SDKs are pinned exactly: an upgrade is a PR (METHODOLOGY §8).
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "daytona[v0-sdk]==2.2.0",
]

[project.urls]
Homepage = "https://github.com/sandboxrouting/sandbox-bench"
Issues = "https://github.com/sandboxrouting/sandbox-bench/issues"
Methodology = "https://github.com/sandboxrouting/sandbox-bench/blob/main/docs/METHODOLOGY.md"

[project.scripts]
sbx = "sandbox_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_bench"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md", "docs/assets/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PIE", "PERF",
    "RUF",
    "PT",           # pytest style
    "TID",          # tidy imports
    "S",            # bandit: subprocess, asserts, temp files
    "BLE",          # no blind `except Exception` without re-raise or logging intent
    "DTZ",          # timezone-aware datetimes only
    "T20",          # no stray print() outside the CLI
    "ERA",          # no commented-out code
    "PL",           # pylint subset
    "N",            # pep8 naming
]
ignore = [
    "PLR0913",  # adapter/probe signatures are dictated by the interface
    "PLR2004",  # magic numbers are fine in a benchmark with fixed constants
    "S603", "S607",  # subprocess calls are deliberate and never take untrusted shell input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR2004", "T20"]
"src/sandbox_bench/cli.py" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["daytona.*", "daytona"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests spend provider credits: they run only when asked for, with `pytest -m live`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "live: talks to a real provider; needs credentials, never runs in CI",
    "posix_shell: runs guest scripts in a local sh; needs Linux /proc",
]

[tool.coverage.run]
source = ["sandbox_bench"]
branch = true
omit = [
    # Live adapters are exercised by `sbx check`, not by the offline suite.
    "*/sandbox_bench/providers/daytona.py",
    "*/sandbox_bench/providers/freestyle.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
